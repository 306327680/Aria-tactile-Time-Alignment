<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化 - Aria-Haptic Alignment Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #dee2e6;
        }

        .tab-button {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: block;
            width: 100%;
        }

        .results-section .plot-container {
            width: 100%;
            max-width: 100%;
        }

        #mps-chart,
        #haptic-chart {
            width: 100% !important;
        }

        /* Override section width for visualize page */
        .tab-content section {
            width: 100%;
            max-width: 100%;
        }

        .tab-content .results-section {
            width: 100%;
            max-width: 100%;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: #667eea;
            color: white;
        }

        .stats-inline {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-inline {
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .stat-inline-label {
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 500;
        }

        .stat-inline-value {
            font-size: 1rem;
            color: #667eea;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="nav-header">
                <h1><span>📊</span> <span data-i18n="visualize.title">数据可视化工具</span></h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="language-toggle" class="btn-language" aria-label="Switch language">English</button>
                    <a href="/" class="nav-link-btn">
                        <span>🎯</span>
                        <span data-i18n="nav.alignment">对齐工具</span>
                    </a>
                    <a href="/player" class="nav-link-btn">
                        <span>🎬</span>
                        <span data-i18n="nav.player">数据播放器</span>
                    </a>
                    <a href="/gripper" class="nav-link-btn">
                        <span>🤖</span>
                        <span data-i18n="nav.gripper">夹爪可视化</span>
                    </a>
                    <a href="/data" class="nav-link-btn">
                        <span>📂</span>
                        <span data-i18n="nav.data_manager">数据管理</span>
                    </a>
                </div>
            </div>
            <p class="subtitle" data-i18n="visualize.subtitle">单独查看 MPS 手部追踪数据和触觉传感器数据</p>
        </header>

        <div class="main-content">
            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-button active" data-tab="mps" data-i18n="visualize.tab.mps">MPS 手部追踪数据</button>
                <button class="tab-button" data-tab="haptic" data-i18n="visualize.tab.haptic">触觉传感器数据</button>
            </div>

            <!-- MPS Tab -->
            <div class="tab-content active" id="tab-mps">
                <section class="upload-section">
                    <h2><span>📁</span> <span data-i18n="visualize.mps.upload">上传 MPS CSV 文件</span></h2>
                    <form id="mpsForm" enctype="multipart/form-data">
                        <div class="file-input-group">
                            <div class="file-input-wrapper">
                                <label for="mps_file" data-i18n="visualize.mps.label">MPS CSV 文件 (hand_tracking_results.csv):</label>
                                <input type="file" id="mps_file" name="mps_file" accept=".csv" required>
                                <span class="file-info" id="mps-file-info" data-i18n="upload.file.none">未选择文件</span>
                            </div>
                        </div>
                    </form>

                    <div class="action-section">
                        <button id="visualizeMpsBtn" class="btn-primary" disabled>
                            <span class="btn-icon">📈</span>
                            <span data-i18n="visualize.mps.button">加载并可视化</span>
                        </button>
                    </div>
                </section>

                <div id="mpsLoadingIndicator" class="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <p data-i18n="loading.load">加载数据中...</p>
                </div>

                <section id="mpsResultsSection" class="results-section" style="display: none;">
                    <h2><span>📊</span> <span data-i18n="visualize.result.mps">MPS 数据可视化</span></h2>
                    <div class="stats-inline" id="mpsStats"></div>
                    <div class="plot-container">
                        <div id="mps-chart"></div>
                    </div>
                </section>

                <div id="mpsErrorSection" class="error-section" style="display: none;">
                    <h3><span>❌</span> <span data-i18n="error.title">错误</span></h3>
                    <div id="mpsErrorMessage"></div>
                </div>
            </div>

            <!-- Haptic Tab -->
            <div class="tab-content" id="tab-haptic">
                <section class="upload-section">
                    <h2><span>📁</span> <span data-i18n="visualize.haptic.upload">上传触觉 CSV 文件</span></h2>
                    <form id="hapticForm" enctype="multipart/form-data">
                        <div class="file-input-group">
                            <div class="file-input-wrapper">
                                <label for="haptic_file" data-i18n="visualize.haptic.label">触觉 CSV 文件:</label>
                                <input type="file" id="haptic_file" name="haptic_file" accept=".csv" required>
                                <span class="file-info" id="haptic-file-info" data-i18n="upload.file.none">未选择文件</span>
                            </div>
                        </div>
                    </form>

                    <div class="action-section">
                        <button id="visualizeHapticBtn" class="btn-primary" disabled>
                            <span class="btn-icon">📈</span>
                            <span data-i18n="visualize.haptic.button">加载并可视化</span>
                        </button>
                    </div>
                </section>

                <div id="hapticLoadingIndicator" class="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <p data-i18n="loading.load">加载数据中...</p>
                </div>

                <section id="hapticResultsSection" class="results-section" style="display: none;">
                    <h2><span>📊</span> <span data-i18n="visualize.result.haptic">触觉数据可视化</span></h2>
                    <div class="stats-inline" id="hapticStats"></div>

                    <!-- Sensor and Axis Selection Controls -->
                    <div id="hapticControls" style="display: none; margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 8px;">
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #495057;">
                                <span data-i18n="visualize.haptic.select_sensors">选择传感器:</span>
                            </label>
                            <div id="sensorCheckboxes" style="display: flex; flex-wrap: wrap; gap: 15px;"></div>
                        </div>

                        <div style="margin-bottom: 15px;">
                            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #495057;">
                                <span data-i18n="visualize.haptic.select_axes">选择数据轴:</span>
                            </label>
                            <div id="axisCheckboxes" style="display: flex; flex-wrap: wrap; gap: 15px;">
                                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                                    <input type="checkbox" value="Fx" class="axis-checkbox" style="cursor: pointer;">
                                    <span style="color: #ff6b6b; font-weight: 600;">Fx (X轴力)</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                                    <input type="checkbox" value="Fy" class="axis-checkbox" style="cursor: pointer;">
                                    <span style="color: #51cf66; font-weight: 600;">Fy (Y轴力)</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                                    <input type="checkbox" value="Fz" class="axis-checkbox" style="cursor: pointer;">
                                    <span style="color: #339af0; font-weight: 600;">Fz (Z轴力)</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                                    <input type="checkbox" value="Total" class="axis-checkbox" checked style="cursor: pointer;">
                                    <span style="color: #f59e0b; font-weight: 600;">Total (总力)</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="plot-container">
                        <div id="haptic-chart"></div>
                    </div>
                </section>

                <div id="hapticErrorSection" class="error-section" style="display: none;">
                    <h3><span>❌</span> <span data-i18n="error.title">错误</span></h3>
                    <div id="hapticErrorMessage"></div>
                </div>
            </div>
        </div>

        <footer>
            <p>Aria-Haptic Alignment Tool | Powered by Flask & Plotly | <a href="https://github.com/306327680/Aria-tactile-Time-Alignment" target="_blank" data-i18n="footer.github">GitHub 仓库</a></p>
        </footer>
    </div>

    <!-- Load i18n first, then visualize.js -->
    <script src="{{ url_for('static', filename='js/i18n.js') }}?v=11"></script>
    <script src="{{ url_for('static', filename='js/visualize.js') }}"></script>
</body>
</html>
